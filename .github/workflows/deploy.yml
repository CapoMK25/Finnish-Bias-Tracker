name: Deploy to Hetzner

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:            # Manual trigger for hotfixes

env:
  TF_DIR: infra
  # Providers are kept between runs so a GitHub outage cannot block a deploy.
  TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache

jobs:
  deploy:
    # Only deploy if the CI succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # Terraform: provision/update infrastructure
      # ============================================================
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Restore Terraform providers
        id: tf-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('infra/.terraform.lock.hcl') }}

      - name: Create plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        # The provider's checksums come from github.com, which sometimes answers 504: retry.
        run: |
          for attempt in 1 2 3 4; do
            if terraform init; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "terraform init failed (attempt $attempt of 4), retrying in $((attempt * 30)) seconds"
              sleep $((attempt * 30))
            fi
          done
          echo "terraform init still failing after 4 attempts"
          exit 1

      - name: Save Terraform providers
        if: steps.tf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('infra/.terraform.lock.hcl') }}

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -out=tfplan -detailed-exitcode
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

      - name: Terraform Apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Get Server IP
        working-directory: ${{ env.TF_DIR }}
        id: tf
        run: echo "ip=$(terraform output -raw server_ip)" >> $GITHUB_OUTPUT
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}

      # ============================================================
      # Wait for SSH to be available
      # ============================================================
      - name: Wait for SSH and cloud-init
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.tf.outputs.ip }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Wait for cloud-init to fully complete
            for i in {1..30}; do
              if cloud-init status | grep -q "done"; then
                echo "Cloud-init complete"
                break
              fi
              echo "Waiting for cloud-init... ($i/30)"
              sleep 10
            done
            
            # Verify Docker is ready
            docker --version
            echo "Server ready for deployment"

      - name: Rsync application files
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: >-
            -avzr --delete
            --exclude='.git'
            --exclude='node_modules'
            --exclude='.venv'
            --exclude='.env'
            --exclude='apps/web/build'
            --exclude='apps/web/.svelte-kit'
            --exclude='apps/api/dist'
            --exclude='infra'
          path: ./
          remote_path: /opt/fbt/
          remote_host: ${{ steps.tf.outputs.ip }}
          remote_user: deploy
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # ============================================================
      # Deploy: rsync code, restart services
      # ============================================================
      - name: Restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.tf.outputs.ip }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/fbt
            
            # Create .env from GitHub secrets if one does not exist
            if [ ! -f .env ]; then
              echo "WARNING: .env not found, creating from a template"
              cp .env.example .env
            fi
            
            # Pull and restart
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            
            # api and web run straight from the synced files, so `up -d` does not
            # notice a code-only change (a merged feature would never go live).
            # Restart each one only if its code changed since the last successful
            # deploy. The fingerprints live in the home directory, outside
            # /opt/fbt, so rsync --delete cannot remove them.
            STATE="$HOME/.fbt-deploy"
            mkdir -p "$STATE"
            code_hash() {
              ( cat package.json package-lock.json
                find "apps/$1" -type f \
                  -not -path '*/node_modules/*' -not -path '*/.svelte-kit/*' \
                  -not -path '*/build/*' -not -path '*/dist/*' -print0 \
                  | sort -z | xargs -0 sha256sum
              ) | sha256sum | cut -d' ' -f1
            }
            RESTART=""
            for svc in api web; do
              code_hash "$svc" > "$STATE/$svc.new"
              if ! cmp -s "$STATE/$svc.new" "$STATE/$svc.hash"; then
                RESTART="$RESTART $svc"
              fi
            done
            if [ -n "$RESTART" ]; then
              echo "Code changed, restarting:$RESTART"
              docker compose -f docker-compose.prod.yml restart $RESTART
            else
              echo "api and web code unchanged, no restart needed"
            fi
            
            # Wait for the API to come up. A recreated container seeds, builds and
            # only then starts listening.
            for i in $(seq 1 45); do
              curl -sf http://localhost:3000/health > /dev/null && break
              if [ "$i" = 45 ]; then
                echo "API did not become healthy within 90s"
                exit 1
              fi
              sleep 2
            done
            
            # Wait for the site. web rebuilds when it restarts, which takes a minute
            # or two (the proxy answers 502 until it is ready).
            SITE=finnishbiastracker.cloud-ip.cc
            for i in $(seq 1 100); do
              curl -sf -o /dev/null --max-time 5 --resolve "$SITE:443:127.0.0.1" "https://$SITE/" && break
              if [ "$i" = 100 ]; then
                echo "Site did not come up in time"
                exit 1
              fi
              sleep 2
            done
            
            # Both are up: remember what is deployed
            for svc in api web; do
              mv "$STATE/$svc.new" "$STATE/$svc.hash"
            done
            
            # Cleanup
            docker image prune -f