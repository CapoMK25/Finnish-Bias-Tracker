<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#fafaf8"/>

  <!-- Spectrum bars centered horizontally -->
  <g transform="translate(150, 180)">
    <rect x="0"   y="0" width="180" height="60" fill="#a83434"/>
    <rect x="180" y="0" width="180" height="60" fill="#c97373"/>
    <rect x="360" y="0" width="180" height="60" fill="#a8a59f"/>
    <rect x="540" y="0" width="180" height="60" fill="#7393c1"/>
    <rect x="720" y="0" width="180" height="60" fill="#3568b3"/>

    <!-- Bias labels under each bar -->
    <text x="90"  y="90" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#1c1c1c" text-anchor="middle">−2</text>
    <text x="270" y="90" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#1c1c1c" text-anchor="middle">−1</text>
    <text x="450" y="90" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#1c1c1c" text-anchor="middle">0</text>
    <text x="630" y="90" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#1c1c1c" text-anchor="middle">+1</text>
    <text x="810" y="90" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#1c1c1c" text-anchor="middle">+2</text>
  </g>

  <!-- Title -->
  <text x="600" y="420" font-family="Inter, sans-serif" font-size="56" font-weight="700" fill="#1c1c1c" text-anchor="middle">
    Finnish Bias Tracker
  </text>

  <!-- Tagline -->
  <text x="600" y="475" font-family="Inter, sans-serif" font-size="26" font-weight="400" fill="#4b5563" text-anchor="middle">
    Mapping political framing across the Finnish press.
  </text>

  <!-- Footer note -->
  <text x="600" y="555" font-family="Inter, sans-serif" font-size="18" font-weight="400" fill="#6b7280" text-anchor="middle">
    Open-source methodology · AGPL-3.0
  </text>
</svg>